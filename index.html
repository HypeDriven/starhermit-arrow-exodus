<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Arrow Exodus</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="/css/menu.css">
<script type="importmap">{ "imports": { "three": "/vendor/three.module.min.js", "three/addons/": "/vendor/addons/" } }</script>
<style>
:root{
  --bg:#0f1216; --panel:#1a1e24; --panel2:#232830; --line:#39414d;
  --text:#eef1f5; --muted:#aab3bf; --accent:#f2b04e; --accent2:#7fd4c1;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;}
#app{min-height:100vh;display:flex;flex-direction:column;}
.screen{display:none;padding:24px 32px;max-width:1180px;width:100%;margin:0 auto;}
.screen.active{display:block;}
h1,h2,h3{font-weight:700;line-height:1.2;margin:.2em 0 .5em;}
a{color:var(--accent);}
.btn{display:inline-block;border:none;background:#2c333d;color:var(--text);padding:10px 18px;font-size:1rem;cursor:pointer;text-align:center;}
.btn:hover:not(:disabled){background:#39424e;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn.primary{background:var(--accent);color:#1a1206;}
.btn.big{font-size:1.1rem;padding:14px 28px;width:100%;}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
.card{background:var(--panel);border-radius:10px;padding:16px;}
.muted{color:var(--muted);}
.small{font-size:.9rem;}
[data-screen="play"] #canvas-host{position:relative;width:min(72vh,100%,640px);max-width:100%;aspect-ratio:1/1;margin:8px auto;background:#0c0f13;border-radius:8px;overflow:hidden;touch-action:manipulation;}
#canvas-host canvas{display:block;width:100%;height:100%;}
#hud-bottom{margin-top:8px;}
#hud-bottom .row{justify-content:center;}
.modal-backdrop{position:fixed;inset:0;z-index:30;background:rgba(8,10,13,.72);align-items:center;justify-content:center;padding:16px;}
.modal.card{max-width:min(92vw,480px);width:100%;max-height:86vh;overflow:auto;}
.score-line{display:flex;justify-content:space-between;gap:16px;padding:3px 0;}
#pause-overlay,#results-overlay,.modal-backdrop{display:none;}
.btn:focus-visible{outline:3px solid var(--accent2);outline-offset:2px;}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:5px 0;}
.set-row input[type=range]{flex:0 1 170px;}
.set-row select{min-height:36px;font-size:1rem;background:var(--panel2);color:var(--text);border:1px solid var(--line);}
#title-art{display:block;width:100%;max-width:640px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;margin:0 0 14px;background:#0c0f13;}
.result-art{display:block;width:100%;max-height:150px;object-fit:cover;border-radius:8px;margin:0 0 10px;background:#0c0f13;}
.gfx-section{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);}
.gfx-section h3{font-size:1.1rem;margin:0 0 4px;color:var(--accent);}
.gfx-section .set-row label{flex:1 1 auto;min-width:0;}
.gfx-section select{max-width:58%;}
.gfx-scale-wrap{display:flex;align-items:center;gap:8px;flex:0 1 210px;min-width:140px;}
.gfx-section .gfx-scale-wrap input[type=range]{flex:1 1 auto;min-width:80px;}
.gfx-scale-val{min-width:3.2em;text-align:right;}
.gfx-summary{margin:8px 0 0;overflow-wrap:anywhere;}
.gfx-note{margin:6px 0 0;color:var(--accent);}
.set-row input[type=checkbox]{width:22px;height:22px;flex:none;}
.set-row select:focus-visible,.set-row input:focus-visible{outline:3px solid var(--accent2);outline-offset:2px;}
#fps-meter{position:fixed;top:6px;right:8px;z-index:40;padding:2px 8px;border-radius:6px;background:rgba(8,10,13,.72);color:var(--accent2);font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;pointer-events:none;}
#caption-line{min-height:1.4em;margin:4px 0 0;text-align:center;color:var(--accent2);}
body.large-text{font-size:19px;}
body.high-contrast{--bg:#000000;--panel:#0a0a0a;--panel2:#141414;--line:#9a9a9a;
  --text:#ffffff;--muted:#dcdcdc;--accent:#ffd34d;--accent2:#5ff2d0;}
body.high-contrast .btn{background:#161616;border:1px solid var(--line);}
body.high-contrast .btn.primary{background:var(--accent);color:#000;}
/* Short landscape (phone rotated): HUD beside the board so the board uses nearly full height. */
@media (orientation:landscape) and (max-height:500px){
  .screen.active[data-screen="play"]{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:12px;padding:8px 12px;align-items:start;}
  [data-screen="play"] #hud-title{grid-column:1;grid-row:1;margin:0;font-size:1.1rem;}
  [data-screen="play"] #hud-subtitle{grid-column:1;grid-row:2;margin:4px 0 0;}
  [data-screen="play"] #canvas-host{grid-column:2;grid-row:1/3;width:min(92vh,100%);height:min(92vh,100%);margin:0;}
  [data-screen="play"] #caption-line{grid-column:3;grid-row:1;text-align:left;margin:0;}
  [data-screen="play"] #hud-bottom{grid-column:3;grid-row:2;margin:0;}
  [data-screen="play"] #hud-bottom .row{justify-content:flex-start;}
}
@media (max-width:640px){
  .screen{padding:16px 14px;}
  h1{font-size:1.6rem;}
  .btn{min-height:44px;}
  .btn.big{padding:12px 20px;}
}
</style>
<script src="/vendor/three.module.min.js" type="module"></script>
<script src="browser-guard.js"></script>
</head>
<body>
<div id="app">

  <!-- ============ TITLE / MAIN MENU ============ -->
  <section class="screen menu-screen" data-screen="title">
    <div class="menu-bg" aria-hidden="true"><img src="/assets/key-art.webp" alt="" onerror="this.parentNode.style.display='none'"></div>
    <div class="menu-vignette" aria-hidden="true"></div>
    <div class="menu-hero" aria-hidden="true">
      <!-- data-src is set once assets/menu/hero.glb is generated; empty = text-only menu, no failed requests -->
      <canvas id="menu-hero-canvas" data-src=""></canvas>
    </div>
    <div class="menu-content">
      <p class="menu-kicker">A fletcher's-workbench puzzle</p>
      <h1 class="menu-title">Arrow Exodus</h1>
      <div class="menu-rule" aria-hidden="true"></div>
      <p class="menu-tagline">Tap unobstructed arrows to send them off the board in their facing direction.</p>
      <p id="account-line" class="menu-account" aria-live="polite"></p>
      <div class="menu-actions">
        <button class="btn primary big" data-action="play">Play</button>
        <div class="menu-secondary">
          <button class="btn" data-action="daily">Daily Challenge</button>
          <button class="btn" data-action="journey-info">Journey</button>
          <button class="btn" data-action="profile">Profile</button>
          <button class="btn" data-action="settings">Settings</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ MODE SELECT ============ -->
  <section class="screen" data-screen="modes">
    <h2>Modes</h2>
    <ul style="padding-left:1.2em;line-height:2;">
      <li><button class="btn" data-action="learn">Learn — interactive lessons, one rule at a time.</button></li>
      <li><button class="btn" data-action="journey">Journey — authored progression with mastery stages.</button></li>
      <li><button class="btn" data-action="daily-mode">Daily — one shared seed per UTC day.</button></li>
      <li><button class="btn" data-action="practice-info">Practice — selectable difficulty, undo where allowed.</button></li>
      <li><button class="btn" data-action="challenge-info">Challenge — constrained goals: move limits, speed targets, altered layouts.</button></li>
      <li><button class="btn" data-action="score-chase-info">Score chase — endless plates; your best is tracked (local).</button></li>
    </ul>
  </section>

  <!-- ============ JOURNEY INFO (pre-play) ============ -->
  <section class="screen" data-screen="journey-info">
    <h2>Journey</h2>
    <p id="ji-summary"></p>
    <div class="row"><button class="btn primary big" data-action="start-journey">Begin Journey</button></div>
    <div class="row"><button class="btn" data-action="back-modes">Back to Modes</button></div>
  </section>

  <!-- ============ PRACTICE INFO (pre-play) ============ -->
  <section class="screen" data-screen="practice-info">
    <h2>Practice</h2>
    <p>Select a difficulty. No effect on competitive rating.</p>
    <div id="pi-list"></div>
    <div class="row"><button class="btn" data-action="back-modes">Back to Modes</button></div>
  </section>

  <!-- ============ CHALLENGE INFO (pre-play) ============ -->
  <section class="screen" data-screen="challenge-info">
    <h2>Challenge</h2>
    <p>Six constrained plates. No undo on any of them.</p>
    <div id="ci-list"></div>
    <div class="row"><button class="btn" data-action="back-modes">Back to Modes</button></div>
  </section>

  <!-- ============ SCORE CHASE INFO (pre-play) ============ -->
  <section class="screen" data-screen="score-chase-info">
    <h2>Score Chase</h2>
    <p id="sci-summary"></p>
    <div class="row"><button class="btn primary big" data-action="start-score-chase">Begin Score Chase</button></div>
    <div class="row"><button class="btn" data-action="back-modes">Back to Modes</button></div>
  </section>

  <!-- ============ PROFILE (pre-play) ============ -->
  <section class="screen" data-screen="profile-info">
    <h2>Profile</h2>
    <p id="pf-summary"></p>
    <div class="row"><button class="btn primary big" data-action="start-profile">Begin Profile</button></div>
    <div class="row"><button class="btn" data-action="back-modes">Back to Modes</button></div>
  </section>

  <!-- ============ PLAY (HUD) ============ -->
  <section class="screen" data-screen="play">
    <h2 id="hud-title"></h2>
    <p id="hud-subtitle" class="small muted"></p>
    <div id="canvas-host"></div>
    <p id="caption-line" class="small" aria-live="polite"></p>
    <div id="hud-bottom"></div>
  </section>

</div>
<script type="module">
import { createRenderer, webglAvailable } from '/js/render3d.js';
window.AXRender = { createRenderer: createRenderer, webglAvailable: webglAvailable };
if (typeof window.AXRNG === 'undefined') {} // UMD sets it via other scripts? no — loaded below if needed
</script>
<script src="/js/rng.js"></script>
<script src="/js/rules.js"></script>
<script src="/js/content.js"></script>
<script src="/js/store.js"></script>
<script src="/js/platform.js"></script>
<script src="/js/audio.js"></script>
<script type="module">
  window.AXGame = (await import('/js/game.js')).default;
</script>
<script type="module" src="/js/menu.js"></script>
</body>
</html>
